services:
  caddy:
    image: caddy:2
    container_name: foodbridge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - foodbridge-network

volumes:
  caddy_data:
  caddy_config:

networks:
  foodbridge-network:
    driver: bridge
